syntax = "proto3";

package auth;

option go_package = "user_service/module/auth/data/data_source;datasource";

import "common/proto_share/share_model.proto";

service AuthService {
  rpc Login (LoginRequestRPC) returns (LoginSuccessResponseRPC);
  rpc VerifyAccessToken (VerifyAccessTokenRequestRPC) returns (VerifyAccessTokenResponseRPC);
}

message LoginRequestRPC {
  string username = 1;
  string password = 2;
}


message LoginSuccessResponseRPC {
  proto_share.EmployeeRPC employeeDetail = 1;
  string accessToken = 2;
}

message VerifyAccessTokenRequestRPC {
  string token = 1;
}

message VerifyAccessTokenResponseRPC {
  int32 employee_id = 1;
  string username = 2;
  int64 exp = 3;
}